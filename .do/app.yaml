# DigitalOcean App Platform spec. Guide: docs/deployment.md.
# REPLACE_ME values are secrets or keys: fill them in a git-ignored copy (.do/app.local.yaml), never here.
name: waypoint
region: sfo

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# No `databases:` block: App Platform counts attached clusters against the new-database limit.
# Connection values are filled in directly; add the app to each cluster's trusted sources by hand.
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: gateway

services:
  - name: gateway
    github:
      repo: T-Reg/waypoint
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8080
    # Admin (8081) and management (8082) are reachable only from components of this app.
    internal_ports: [8081, 8082]
    # JVM start (~20s on a shared vCPU) plus migrations and key registration must fit in delay + period × threshold.
    health_check:
      port: 8082
      http_path: /actuator/health/readiness
      initial_delay_seconds: 40
      period_seconds: 5
      timeout_seconds: 2
      failure_threshold: 6
    liveness_health_check:
      port: 8082
      http_path: /actuator/health/liveness
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 2
      failure_threshold: 6
    # The platform drains new traffic before SIGTERM; the gateway then finishes in-flight requests.
    termination:
      drain_seconds: 15
      grace_period_seconds: 60
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: jdbc:postgresql://REPLACE_ME_pg_host:25060/waypoint?sslmode=verify-full&sslfactory=org.postgresql.ssl.SingleCertValidatingFactory&sslfactoryarg=env:DATABASE_CA_CERT
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: REPLACE_ME_pg_ca_cert_pem
      - key: DATABASE_USERNAME
        scope: RUN_TIME
        value: waypoint_app
      - key: DATABASE_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_waypoint_app_password
      - key: GATEWAY_STORE_MIGRATION_USERNAME
        scope: RUN_TIME
        value: waypoint_migrator
      - key: GATEWAY_STORE_MIGRATION_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_waypoint_migrator_password
      - key: VALKEY_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_valkey_rediss_url
      - key: GATEWAY_AUDIT_HMAC_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_audit_hmac_key
      - key: GATEWAY_CUSTOMER_PUBLIC_JWK
        scope: RUN_TIME
        value: REPLACE_ME_issuer_public_jwk_json
      - key: GATEWAY_ADMIN_PUBLIC_JWK
        scope: RUN_TIME
        value: REPLACE_ME_admin_public_jwk_json
      - key: GATEWAY_SHUTDOWN_DELAY
        scope: RUN_TIME
        value: 5s
    # Runtime logs (including audit lines) are copied to Managed OpenSearch; the cluster must exist first.
    log_destinations:
      - name: audit-opensearch
        open_search:
          cluster_name: waypoint-logs
          index_name: waypoint-logs

  - name: upstream
    github:
      repo: T-Reg/waypoint
      branch: main
      deploy_on_push: false
    source_dir: deploy/upstream
    dockerfile_path: deploy/upstream/Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    internal_ports: [8080]
    health_check:
      port: 8080
      http_path: /__admin/health
