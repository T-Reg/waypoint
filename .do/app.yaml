# DigitalOcean App Platform spec. Guide: docs/deployment.md.
# REPLACE_ME values are secrets or keys: fill them in a git-ignored copy (.do/app.local.yaml), never here.
name: waypoint
region: sfo

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# Attaching the clusters adds the app to their trusted sources and enables the ${pg.*} / ${valkey.*} bindings.
databases:
  - name: pg
    engine: PG
    production: true
    cluster_name: waypoint-pg
    db_name: waypoint
    db_user: waypoint_app
  - name: valkey
    engine: VALKEY
    production: true
    cluster_name: waypoint-valkey

ingress:
  rules:
    # Most specific prefix first. The prefix is stripped, so the visualizer serves itself at "/".
    - match:
        path:
          prefix: /visualizer
      component:
        name: visualizer
    - match:
        path:
          prefix: /
      component:
        name: gateway

services:
  - name: gateway
    github:
      repo: T-Reg/waypoint
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8080
    # Admin (8081) and management (8082) are reachable only from components of this app.
    internal_ports: [8081, 8082]
    health_check:
      port: 8082
      http_path: /actuator/health/readiness
      initial_delay_seconds: 10
      period_seconds: 5
      timeout_seconds: 2
      failure_threshold: 3
    liveness_health_check:
      port: 8082
      http_path: /actuator/health/liveness
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 2
      failure_threshold: 6
    # The platform drains new traffic before SIGTERM; the gateway then finishes in-flight requests.
    termination:
      drain_seconds: 15
      grace_period_seconds: 60
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: jdbc:postgresql://${pg.HOSTNAME}:${pg.PORT}/${pg.DATABASE}?sslmode=verify-full&sslfactory=org.postgresql.ssl.SingleCertValidatingFactory&sslfactoryarg=env:DATABASE_CA_CERT
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${pg.CA_CERT}
      - key: DATABASE_USERNAME
        scope: RUN_TIME
        value: ${pg.USERNAME}
      - key: DATABASE_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${pg.PASSWORD}
      - key: GATEWAY_STORE_MIGRATION_USERNAME
        scope: RUN_TIME
        value: waypoint_migrator
      - key: GATEWAY_STORE_MIGRATION_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_waypoint_migrator_password
      - key: VALKEY_URL
        scope: RUN_TIME
        type: SECRET
        value: ${valkey.DATABASE_URL}
      - key: GATEWAY_AUDIT_HMAC_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_audit_hmac_key
      # A JWK set: the issuer's key plus the visualizer's demo key ({"keys":[...]}); drop the demo key to revoke it.
      - key: GATEWAY_CUSTOMER_PUBLIC_JWK
        scope: RUN_TIME
        value: REPLACE_ME_issuer_and_demo_public_jwk_set_json
      - key: GATEWAY_ADMIN_PUBLIC_JWK
        scope: RUN_TIME
        value: REPLACE_ME_admin_public_jwk_json
      - key: GATEWAY_SHUTDOWN_DELAY
        scope: RUN_TIME
        value: 5s
      # Demo only: names the serving instance in X-Gateway-Instance so the visualizer can draw it.
      - key: GATEWAY_EXPOSE_INSTANCE_HEADER
        scope: RUN_TIME
        value: "true"

  - name: upstream
    github:
      repo: T-Reg/waypoint
      branch: main
      deploy_on_push: false
    source_dir: deploy/upstream
    dockerfile_path: deploy/upstream/Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    internal_ports: [8080]
    health_check:
      port: 8080
      http_path: /__admin/health

  # Demo client and live visualizer at ${APP_URL}/visualizer/ (docs/visualizer.md). Holds only the demo issuer key.
  - name: visualizer
    github:
      repo: T-Reg/waypoint
      branch: main
      deploy_on_push: false
    dockerfile_path: visualizer/Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8090
    health_check:
      port: 8090
      http_path: /actuator/health
      initial_delay_seconds: 10
    envs:
      - key: SPRING_PROFILES_ACTIVE
        scope: RUN_TIME
        value: app-platform
      - key: VISUALIZER_LB_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: VISUALIZER_ISSUER_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_demo_issuer_private_jwk_json
      - key: VISUALIZER_ACCESS_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_visualizer_password
