global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend public
    bind :8080
    # TLS would terminate here in production.
    option forwardfor
    default_backend gateways

backend gateways
    balance roundrobin
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    server gateway-1 gateway-1:8080 check port 8082
    server gateway-2 gateway-2:8080 check port 8082
